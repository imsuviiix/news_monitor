name: Daily news digest

on:
  # cron-job.org 같은 외부 스케줄러가 07:00(KST) 정시에 이 워크플로를 호출한다.
  workflow_dispatch: {}
  # 안전망: 외부 호출이 실패해도 늦게라도 한 번은 실행. 22:25 UTC = 다음날 07:25 KST,
  # 일~목(UTC)=월~금(KST). 이미 그날 발송했다면 아래 가드가 중복 발송을 막는다.
  schedule:
    - cron: "25 22 * * 0-4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 오늘(KST) 이미 발송했는지 마커로 확인. 외부 정시 호출과 안전망 스케줄이
      # 둘 다 돌더라도 하루 한 번만 텔레그램으로 나가도록 한다.
      - name: Check if already sent today
        id: guard
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          if [ -f data/last_sent.txt ] && [ "$(cat data/last_sent.txt)" = "$today" ]; then
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            echo "오늘($today)은 이미 발송됨 → 전송 생략"
          else
            echo "should_send=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect overnight news
        run: python run_daily.py --skip-telegram

      - name: Commit digest history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/digest_*.json data/latest.json
          git diff --cached --quiet || git commit -m "Add digest ${{ steps.guard.outputs.today }}"
          git push

      - name: Build static site
        run: python build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      # 사이트 배포까지 끝난 뒤 전송. 실패하면 이 스텝이 빨간색으로 뜨고,
      # 마커를 안 남기므로 다음 실행(안전망 스케줄 등)에서 다시 시도한다.
      - name: Send digest to Telegram
        if: steps.guard.outputs.should_send == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_bot.py
          echo "${{ steps.guard.outputs.today }}" > data/last_sent.txt

      # 발송에 성공했을 때만 "오늘 발송함" 마커를 커밋해 중복 발송을 막는다.
      - name: Record sent marker
        if: steps.guard.outputs.should_send == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_sent.txt
          git diff --cached --quiet || git commit -m "Mark digest sent ${{ steps.guard.outputs.today }}"
          git push
